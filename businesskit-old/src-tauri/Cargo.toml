[package]
name = "businesskit"
version = "0.0.20"
description = "BusinessKit Desktop App"
authors = ["BusinessKit"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2.11.2", features = ["protocol-asset"] }
tauri-plugin-log = "2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Turso / libsql — HTTP mode for remote Turso
libsql = { version = "0.6", default-features = false, features = ["remote", "tls"] }

# Encryption — AES-256-GCM, mirrors vault.ts
aes-gcm = "0.10"
base64 = "0.22"
hex = "0.4"
pbkdf2 = { version = "0.12", features = ["hmac"] }
sha2 = "0.10"
hmac = "0.12"

# Unique IDs
uuid = { version = "1", features = ["v4"] }

# Image processing — AVIF auto-conversion
image = { version = "0.25", default-features = false, features = ["avif", "webp", "png", "jpeg"] }
ravif = "0.13"
imgref = "1.10"
rgb = "0.8"
md5 = "0.7"

# HTTP client — CF API, GitHub releases, WorkOS
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "stream", "multipart"] }
hickory-resolver = "0.24"
urlencoding = "2"

# AWS SES
aws-config = "1.5"
aws-sdk-sesv2 = "1.51"

# Dates
chrono = { version = "0.4", features = ["serde"] }

# OS Keychain — Turso creds + CF token, never plaintext on disk

# Background scheduler — 24hr license recheck
tokio-cron-scheduler = "0.13"

# Error handling
anyhow = "1"
thiserror = "1"

# .env loading at runtime (dev + production app bundle)
dotenvy = "0.15"

# Logging
log = "0.4"

# Random bytes for crypto
rand = "0.8"

# App data directory (license cache)
dirs = "5"

# Open URLs in system browser — cross-platform (Mac, Windows, iOS)
open = "5"

# Loopback OAuth callback server (RFC 8252 desktop auth pattern)
tiny_http = "0.12"
tauri-plugin-shell = "2.3.5"
tauri-plugin-dialog = "2.7.1"
mime_guess = "2.0.5"
zip-extract = "0.4.1"
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2.2.3"


[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
arboard = "3.6.1"
portable-pty = "0.8"
